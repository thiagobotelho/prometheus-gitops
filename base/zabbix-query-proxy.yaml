apiVersion: v1
kind: ServiceAccount
metadata:
  name: zabbix-query-proxy
  namespace: observability-apps
  annotations:
    argocd.argoproj.io/sync-wave: "4"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: zabbix-query-proxy-auth-delegator
  annotations:
    argocd.argoproj.io/sync-wave: "4"
# Referência de permissão; este vínculo não cria identidades no provedor.
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
# Identidades que recebem as permissões declaradas pelo papel referenciado.
subjects:
  - kind: ServiceAccount
    name: zabbix-query-proxy
    namespace: observability-apps
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zabbix-prometheus-query
  namespace: observability-apps
  annotations:
    argocd.argoproj.io/sync-wave: "4"
rules:
  - apiGroups:
      - ""
    # Recursos ou dependências desta seção; avaliar seu escopo antes de alterar.
    resources:
      - services/proxy
    resourceNames:
      - zabbix-query-proxy
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zabbix-prometheus-query
  namespace: observability-apps
  annotations:
    argocd.argoproj.io/sync-wave: "4"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zabbix-prometheus-query
subjects:
  - kind: ServiceAccount
    name: zabbix-prometheus-reader
    namespace: zabbix
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zabbix-query-proxy-config
  namespace: observability-apps
  annotations:
    argocd.argoproj.io/sync-wave: "4"
data:
  config.yaml: |
    authorization:
      resourceAttributes:
        namespace: observability-apps
        apiVersion: v1
        resource: services
        subresource: proxy
        name: zabbix-query-proxy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zabbix-query-proxy
  namespace: observability-apps
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  # Número de instâncias; réplicas isoladamente não garantem alta disponibilidade.
  replicas: 1
  # Seletores precisam corresponder aos labels dos recursos de destino.
  selector:
    matchLabels:
      app.kubernetes.io/name: zabbix-query-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zabbix-query-proxy
        app.kubernetes.io/component: query-proxy
    spec:
      serviceAccountName: zabbix-query-proxy
      automountServiceAccountToken: true
      containers:
        - name: kube-rbac-proxy
          image: quay.io/openshift-release-dev/ocp-v4.0-art-dev@sha256:96a94e57ccff7cac3eba0a3c64ddca0371624f31b025bccab550633969249361
          args:
            - --insecure-listen-address=0.0.0.0:8080
            - --upstream=http://apps-monitoring-prometheus.observability-apps.svc:9090
            - --config-file=/etc/kube-rbac-proxy/config.yaml
            - --allow-paths=/api/v1/query,/api/v1/query_range,/-/ready,/-/healthy
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # Prontidão controla recebimento de tráfego, sem provar integrações externas.
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          # Falha desta sonda pode reiniciar o container; evite depender de serviços externos.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          # Restringe privilégios do processo; conferir compatibilidade com a SCC.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /etc/kube-rbac-proxy
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: zabbix-query-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: zabbix-query-proxy
  namespace: observability-apps
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  selector:
    app.kubernetes.io/name: zabbix-query-proxy
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: zabbix-prometheus-query
  namespace: observability-apps
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  to:
    kind: Service
    name: zabbix-query-proxy
    weight: 100
  port:
    targetPort: http
  # TLS define transporte e confiança; não desabilitar validação para contornar erros.
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
