apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

labels:
  - pairs:
      app.kubernetes.io/name: prometheus-apps
      app.kubernetes.io/instance: prometheus-apps-aceite
      app.kubernetes.io/component: monitoring
      app.kubernetes.io/part-of: observability
      app.kubernetes.io/managed-by: argocd
      app.kubernetes.io/environment: aceite
    includeSelectors: false

patches:
  - target:
      kind: MonitoringStack
      name: apps-monitoring
    patch: |-
      - op: replace
        path: /spec/retention
        value: 30d
      - op: replace
        path: /spec/prometheusConfig/persistentVolumeClaim/resources/requests/storage
        value: 25Gi
