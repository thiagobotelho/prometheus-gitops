apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

labels:
  - pairs:
      app.kubernetes.io/instance: prometheus-apps-producao
      app.kubernetes.io/component: monitoring
      app.kubernetes.io/environment: producao
    includeSelectors: false

patches:
  - target:
      kind: MonitoringStack
      name: apps-monitoring
    patch: |-
      - op: replace
        path: /spec/retention
        value: 30d
      - op: replace
        path: /spec/prometheusConfig/persistentVolumeClaim/resources/requests/storage
        value: 100Gi
      - op: replace
        path: /spec/resources/requests/cpu
        value: 250m
      - op: replace
        path: /spec/resources/requests/memory
        value: 512Mi
      - op: replace
        path: /spec/resources/limits/cpu
        value: "1"
      - op: replace
        path: /spec/resources/limits/memory
        value: 1Gi
